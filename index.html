<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Explore the Map | Lighting Up Canada</title>

  <meta
    name="description"
    content="Explore verified plant-based food policies, procurement initiatives, menu changes, and institutional commitments across Canada."
  >
  <meta name="theme-color" content="#002d66">

  <link rel="icon" type="image/jpeg" href="./assets/pbcm-logo.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@500;600;700;800&family=Open+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <link
    rel="stylesheet"
    href="https://cdn.maptiler.com/maptiler-sdk-js/v3.9.0/maptiler-sdk.css"
  >

  <link rel="stylesheet" href="./style.css?v=compact-header-directory-tab-1">
</head>

<body>
  <a class="skip-link" href="#directory-app">
    Skip to the directory and map
  </a>

  <header class="site-header">
    <a
      class="brand"
      href="./"
      aria-label="Lighting Up Canada map"
    >
      <span class="brand-project">
        <strong>Lighting Up Canada</strong>
        <span>Interactive map of plant-based progress</span>
      </span>
    </a>
  </header>

  <main id="directory-app" class="directory-app">
    <aside
      id="results-panel"
      class="results-panel"
      aria-label="Institution directory"
    >
      <div class="sidebar-header">
        <div>
          <p class="sidebar-kicker">National directory</p>
          <h1>Explore initiatives</h1>

          <span
            id="result-count"
            class="result-count"
            aria-live="polite"
          >
            0 mapped pins
          </span>
        </div>

        <button
          id="sidebar-toggle"
          class="icon-button sidebar-toggle"
          type="button"
          aria-label="Collapse directory"
          aria-expanded="true"
          aria-controls="results-panel"
          title="Collapse directory"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m14.7 6.3-1.4-1.4L6.2 12l7.1 7.1 1.4-1.4L9 12l5.7-5.7Z"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-controls">
        <label class="search-field" for="institution-search">
          <span class="sr-only">
            Search institutions, cities, initiatives
          </span>

          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m20.7 19.3-4.2-4.2a7 7 0 1 0-1.4 1.4l4.2 4.2 1.4-1.4ZM5 11a6 6 0 1 1 12 0 6 6 0 0 1-12 0Z"/>
          </svg>

          <input
            id="institution-search"
            type="search"
            placeholder="Search institutions, cities, or initiatives"
            autocomplete="off"
            spellcheck="false"
          >
        </label>

        <div class="filter-row" aria-label="Filter by institution type">
          <button class="filter-chip active" type="button" data-type="all">
            All
          </button>

          <button class="filter-chip" type="button" data-type="city">
            Municipality
          </button>

          <button class="filter-chip" type="button" data-type="university">
            Educational
          </button>

          <button class="filter-chip" type="button" data-type="hospital">
            Healthcare
          </button>

          <button class="filter-chip" type="button" data-type="government">
            Government
          </button>

          <button class="filter-chip" type="button" data-type="other">
            Other
          </button>
        </div>

        <div class="sidebar-actions">
          <span>
            Select a record to view its evidence and profile
          </span>

          <button
            id="reset-view"
            class="link-button"
            type="button"
          >
            Reset
          </button>
        </div>
      </div>

      <div
        id="institution-list"
        class="institution-list"
        aria-live="polite"
        aria-busy="true"
      ></div>

      <div
        id="empty-state"
        class="empty-state"
        hidden
      >
        <strong>No matching initiatives</strong>
        <p>Try another search term or category.</p>
      </div>
    </aside>

    <section
      class="map-shell"
      aria-label="Interactive map of plant-forward initiatives across Canada"
    >
      <div class="map-frame">
        <div
          id="map"
          tabindex="0"
          aria-label="Interactive map showing plant-forward institutions across Canada"
        ></div>

        <button
          id="sidebar-open"
          class="directory-pull-tab sidebar-open"
          type="button"
          hidden
          aria-label="Open institution directory"
          aria-controls="results-panel"
          title="Open directory"
        >
          <span>Search the map</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9.3 17.7 1.4 1.4 7.1-7.1-7.1-7.1-1.4 1.4L15 12l-5.7 5.7Z"/>
          </svg>
        </button>

        <section id="map-legend" class="map-legend" aria-label="Map legend">
          <button
            id="legend-toggle"
            class="legend-toggle"
            type="button"
            aria-expanded="true"
            aria-controls="legend-content"
          >
            <span class="legend-heading">Map key</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m7.4 9.4 4.6 4.6 4.6-4.6 1.4 1.4-6 6-6-6 1.4-1.4Z"/>
            </svg>
          </button>

          <div id="legend-content" class="legend-content">
            <div id="type-legend" class="legend-grid legend-type-grid"></div>
          </div>
        </section>
      </div>

      <aside
        id="profile-drawer"
        class="profile-drawer"
        aria-hidden="true"
        aria-labelledby="drawer-name"
      >
        <button
          id="drawer-close"
          class="drawer-close"
          type="button"
          aria-label="Close institution profile"
          title="Close profile"
        >
          ×
        </button>

        <div id="drawer-content"></div>
      </aside>
    </section>
  </main>

  <div
    id="mobile-scrim"
    class="mobile-scrim"
    hidden
    aria-hidden="true"
  ></div>

  <noscript>
    <div class="noscript-message">
      This interactive map requires JavaScript. Please enable JavaScript to explore the directory.
    </div>
  </noscript>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.maptiler.com/maptiler-sdk-js/v3.9.0/maptiler-sdk.umd.min.js"></script>
<script src="https://cdn.maptiler.com/leaflet-maptilersdk/v4.1.1/leaflet-maptilersdk.js"></script>
  <script src="./script.js?v=compact-header-directory-tab-1" defer></script>
</body>
</html>
